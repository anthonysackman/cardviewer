services:
  migrate:
    image: ghcr.io/anthonysackman/cardviewer-api:latest
    build: ./api
    # Same bind-mount as `api`: after `git pull` on the server, migrations use current alembic/ from disk.
    # Without this, migrate only ran whatever was baked into the pulled image (stale vs repo).
    volumes:
      - ./api:/app
    command: python scripts/run_migrate.py
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    restart: "no"

  api:
    image: ghcr.io/anthonysackman/cardviewer-api:latest
    build: ./api
    ports:
      - '8000:8000'
    volumes:
      - ./api:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
      - ASYNC_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - app

  ui:
    image: ghcr.io/anthonysackman/cardviewer-ui:latest
    build: ./ui
    ports:
      - '5173:5173'
    volumes:
      - ./ui/src:/app/src
      - /app/node_modules
    working_dir: /app
    depends_on:
      - api
    networks:
      - app
  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app
    depends_on:
      - api
      - ui

  redis:
    image: redis:7-alpine
    networks:
      - app
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'

volumes:
  postgres_data:
  redis_data:

networks:
  app:
