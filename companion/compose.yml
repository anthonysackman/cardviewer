services:
  api:
    build: ./api
    ports:
      - '8000:8000'
    volumes:
      - ./api:/app
    working_dir: /app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    depends_on:
      - postgres
    networks:
      - app

  ui:
    build: ./ui
    ports:
      - '5173:5173'
    volumes:
      - ./ui/src:/app/src
      - /app/node_modules
    working_dir: /app
    depends_on:
      - api
    networks:
      - app
  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    networks:
      - app

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app
    depends_on:
      - api
      - ui

volumes:
  postgres_data:

networks:
  app:
