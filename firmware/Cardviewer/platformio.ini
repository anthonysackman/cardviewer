; Freenove ESP32-WROOM + Waveshare 4.2" GDEY042T81
; Use a WROOM profile (no SPIRAM). Do NOT use freenove_esp32_wrover — that is for WROVER + PSRAM
; and will probe PSRAM at boot (ID 0xffffffff on WROOM boards).

[env:esp32_wroom]
platform = espressif32
board = esp32dev
framework = arduino

board_build.psram = disabled

lib_deps =
  ZinggJM/GxEPD2 @ ^1.6.0
  bblanchon/ArduinoJson @ ^7.2.0
  bitbank2/JPEGDEC @ ^1.8.0

build_flags =
  -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200

; If your Freenove board has 8MB flash instead of 4MB, uncomment:
; board_build.flash_size = 8MB
