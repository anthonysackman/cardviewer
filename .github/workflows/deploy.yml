name: deploy
on:
  workflow_dispatch:
jobs:
  migrate-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API dependencies
        run: pip install -r companion/api/requirements.txt

      - name: Run database migrations
        working-directory: companion/api
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: python -m alembic upgrade head

  deploy:
    runs-on: ubuntu-latest
    needs: migrate-check
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: companion/api
          push: true
          tags: ghcr.io/anthonysackman/cardviewer-api:latest

      - name: Build and push UI
        uses: docker/build-push-action@v5
        with:
          context: companion/ui
          push: true
          tags: ghcr.io/anthonysackman/cardviewer-ui:latest

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            if [ ! -d ~/cardviewer ]; then
              git clone https://github.com/anthonysackman/cardviewer.git ~/cardviewer
            fi
            cd ~/cardviewer
            git pull
            docker compose -f companion/compose.yml pull
            docker compose -f companion/compose.yml up -d
