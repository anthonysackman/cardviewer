name: deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: companion/api
          push: true
          tags: ghcr.io/anthonysackman/cardviewer-api:latest

      - name: Build and push UI
        uses: docker/build-push-action@v5
        with:
          context: companion/ui
          push: true
          tags: ghcr.io/anthonysackman/cardviewer-ui:latest

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d /app/cardviewer ]; then
              mkdir -p /app/cardviewer
              git clone https://github.com/anthonysackman/cardviewer.git /app/cardviewer
            fi
            cd /app/cardviewer
            git pull
            docker compose -f companion/compose.yml pull
            docker compose -f companion/compose.yml up -d
